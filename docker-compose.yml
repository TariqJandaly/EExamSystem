services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Paste your Neon connection string in Dokploy's env vars
      CONNECTION_STRING: ${CONNECTION_STRING}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "5155:8080"   # API  (optional — expose only if you need direct API access)
      - "5019:8081"   # Client (point your domain here in Dokploy)
